[project]
name = "benchkit"
version = "1.0.0"
description = "A benchmark engine for curated-corpus evaluation: run open or closed tasks through an agent, then score the answers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "litellm>=1.74.0,<2",
]

[project.scripts]
benchkit = "benchkit.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
